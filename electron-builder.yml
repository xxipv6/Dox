appId: com.dox.terminal
productName: Dox
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json
  - build/icon.png

# dox-agent 各平台构建：安装助手时按远端架构从 resources/agent 里挑
extraResources:
  - from: build/agent
    to: agent

asar: true

# node-pty 自带全平台预编译（prebuilds/ 里有 darwin/win32 的 .node，且是
# ABI 稳定接口——dev 里 Electron 直接加载它们就是证明），任何平台都不要
# 重编译：跨平台打包（Mac 上出 win 包）就靠这个开关成立
npmRebuild: false

# ---------- Windows ----------
win:
  icon: build/icon.png
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Dox

# ---------- macOS ----------
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  # 签名与公证需要 Apple 开发者证书，配置 CSC_LINK / APPLE_API_KEY 等环境变量后自动启用
  identity: null

# ---------- Linux ----------
linux:
  icon: build/icon.png
  category: Development
  target:
    - AppImage
    - deb

# ---------- 自动更新 ----------
# 发布渠道：GitHub Releases。electron-updater 按 owner/repo 拼更新地址，
# 与 package.json 的 repository 保持一致；两者对不上会让「检查更新」静默失败
# （用户只会看到永远没有新版本）。
# CI 中 electron-builder --publish always 即可推送更新。
publish:
  provider: github
  owner: xxipv6
  repo: Dox
  # electron-builder 默认建 draft，而 electron-updater 只看得见已发布的 Release
  # （latest.yml 在 draft 里等于没发）。合法键是 releaseType，没有 draft 键
  releaseType: release
