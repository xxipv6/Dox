appId: com.dox.terminal
productName: Dox
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json
  # 拖出到资源管理器时用做拖拽图标，运行时按 asar 路径读
  - build/icon.png

asar: true

# ---------- Windows ----------
win:
  icon: build/icon.png
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Dox

# ---------- macOS ----------
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  # 签名与公证需要 Apple 开发者证书，配置 CSC_LINK / APPLE_API_KEY 等环境变量后自动启用
  identity: null

# ---------- Linux ----------
linux:
  icon: build/icon.png
  category: Development
  target:
    - AppImage
    - deb

# ---------- 自动更新 ----------
# 发布渠道：GitHub Releases。electron-updater 按 owner/repo 拼更新地址，
# 与 package.json 的 repository 保持一致；两者对不上会让「检查更新」静默失败
# （用户只会看到永远没有新版本）。
# CI 中 electron-builder --publish always 即可推送更新。
publish:
  provider: github
  owner: xxipv6
  repo: Dox
